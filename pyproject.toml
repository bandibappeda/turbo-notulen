[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splitmedia"
version = "1.0.0"
description = "Aplikasi terminal untuk split audio/video dari URL maupun file lokal"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2025.1.1",
    "rich>=13.7",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
splitmedia = "splitmedia.app:main"

[tool.setuptools.packages.find]
include = ["splitmedia*"]
